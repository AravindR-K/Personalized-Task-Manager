<div class="glass-container app-wrapper">

  <div class="header">
    <h1>My Tasks</h1>
    <p>Stay organized and focused</p>
  </div>

  <div class="input-group">
    <input type="text" class="glass-input" [(ngModel)]="newTask" placeholder="What needs to be done?"
      (keyup.enter)="addTask()">
    <button class="primary-btn" (click)="addTask()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <ul class="task-list">
    <li *ngFor="let task of tasks" class="task-item glass-card" [class.completed]="task.completed">
      <label class="custom-checkbox">
        <input type="checkbox" [checked]="task.completed" (change)="toggleTaskCompletion(task)">
        <span class="checkmark"></span>
      </label>

      <span class="task-title">{{task.title}}</span>

      <button class="delete-btn" (click)="deleteTask(task._id)">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </li>
  </ul>

  <!-- Empty State -->
  <div *ngIf="tasks.length === 0" class="empty-state">
    <p>No tasks yet. Add one above!</p>
  </div>

</div>
